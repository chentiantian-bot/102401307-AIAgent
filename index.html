<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园失物招领</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
    <header>
        <h1>校园失物招领平台</h1>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="搜索物品名称...">
            <select id="categorySelect">
                <option value="">全部类别</option>
                <option value="card">校园卡</option>
                <option value="key">钥匙</option>
                <option value="book">书本</option>
                <option value="electronic">电子产品</option>
                <option value="other">其他</option>
            </select>
            <button id="publishBtn">发布招领</button>
        </div>
    </header>

    <div id="cardList" class="card-list"></div>
    <div id="emptyTip" class="empty-tip" style="display:none;">暂无物品信息</div>
</div>

<!-- 发布弹窗 -->
<div id="publishModal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h2>发布失物/招领</h2>
        <form id="publishForm">
            <div class="form-item">
                <label>类型</label>
                <select name="type" required>
                    <option value="lost">寻物启事</option>
                    <option value="found">拾物招领</option>
                </select>
            </div>
            <div class="form-item">
                <label>物品名称</label>
                <input type="text" name="name" required>
            </div>
            <div class="form-item">
                <label>物品类别</label>
                <select name="category" required>
                    <option value="card">校园卡</option>
                    <option value="key">钥匙</option>
                    <option value="book">书本</option>
                    <option value="electronic">电子产品</option>
                    <option value="other">其他</option>
                </select>
            </div>
            <div class="form-item">
                <label>物品描述</label>
                <textarea name="desc" required></textarea>
            </div>
            <div class="form-item">
                <label>地点</label>
                <input type="text" name="place" required>
            </div>
            <div class="form-item">
                <label>联系方式</label>
                <input type="text" name="contact" required>
            </div>
            <button type="submit">提交发布</button>
        </form>
    </div>
</div>

<!-- 详情弹窗 -->
<div id="detailModal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <div id="detailBody"></div>
    </div>
</div>

<script src="js/main.js"></script>
<script src="js/unittest.js"></script>
</body>
</html>
